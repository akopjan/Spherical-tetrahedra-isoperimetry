name = "SphericalTetrahedron"
version = "0.1.0"
defaultTargets = ["Challenge", "Solution", "Sphere3", "SphericalTetrahedron", "SphericalTetrahedronManuscript"]

[leanOptions]
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

[[lean_lib]]
name = "SolutionCore"

[[lean_lib]]
name = "Sphere3"

[[lean_lib]]
name = "SphericalTetrahedron"

[[lean_lib]]
name = "SphericalTetrahedronManuscript"
